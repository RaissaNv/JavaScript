<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var nome = window.prompt('Qual e seu nome?')
        document.writeln(`Ola, ${nome}. Seu nome tem ${nome.length} letras`)
        document.writeln(`Seu nome em mausculos e ${nome.toLocaleUpperCase()}`)
        document.writeln(`Seu nome em minusculas e ${nome.toLocaleLowerCase()}`)
    </script>
</body>
</html>
